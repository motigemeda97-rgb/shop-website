<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickCart Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="logo">🛒 QuickCart</h1>

    <input id="search" type="search" placeholder="Search products..." />
    <select id="category"></select>
    <button id="cart-button" class="cart-btn">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>
  <main>
    <h2 class="section-title">Our Products</h2>
    <div id="product-grid" class="product-grid"></div>
    <p id="no-results" class="no-results" hidden>No products match your search.</p>
  </main>

  <aside id="cart-panel" class="cart-panel">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart" class="icon-btn" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>

    <div class="cart-footer">
      <p class="cart-total">Total: <strong id="cart-total">$0.00</strong></p>
      <button id="checkout-btn" class="primary-btn">Checkout</button>
    </div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>
  <div id="checkout-modal" class="modal" hidden>
    <form id="checkout-form">
      <h2>Checkout</h2>
      <p id="order-summary" class="order-summary"></p>

      <label>Full name
        <input id="name" type="text" required />
      </label>

      <label>Email
        <input id="email" type="email" required />
      </label>

      <label>Delivery address
        <textarea id="address" rows="3" required></textarea>
      </label>

      <div class="modal-buttons">
        <button type="button" id="cancel-checkout" class="secondary-btn">Cancel</button>
        <button type="submit" class="primary-btn">Place Order</button>
      </div>
    </form>
    <div id="success-message" hidden>
      <h2>🎉 Order placed!</h2>
      <p id="success-text"></p>
      <button id="close-success" class="primary-btn">Continue shopping</button>
    </div>
  </div>
  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
